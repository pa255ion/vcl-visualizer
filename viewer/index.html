<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VCL Visualizer</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header id="bar">
    <span class="brand"><i class="logo"></i>VCL</span>
    <span id="status" data-state="connecting">connecting…</span>
    <form id="ask-form" hidden>
      <input id="ask" placeholder="Ask the teacher…" autocomplete="off" enterkeyhint="send">
      <button type="button" id="mic" hidden title="Click, then speak">Talk</button>
    </form>
    <span class="spacer"></span>
    <a id="headset" class="btn ghost" href="quest.html" hidden title="Connect a Quest headset to this server">Headset</a>
    <button id="toggle-editor" class="ghost" title="Lessons and the editor">Editor</button>
    <button id="settings-btn" class="ghost icon" title="Scene, sound and voice" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
    <button id="enter-vr" class="primary" hidden>Enter VR</button>
    <button id="enter-ar" hidden>Enter AR</button>
  </header>

  <div id="settings" class="pop" hidden>
    <section>
      <h3>Scene</h3>
      <div id="scenes" class="swatches"></div>
    </section>
    <section>
      <h3>Sound</h3>
      <label class="slider" title="Music and the background sound"><span>Music</span>
        <input type="range" id="music-vol" min="0" max="100" step="1"><output id="music-out"></output></label>
      <label class="slider" title="Soft sounds as things are drawn, and question chimes"><span>Effects</span>
        <input type="range" id="fx-vol" min="0" max="100" step="1"><output id="fx-out"></output></label>
    </section>
    <section>
      <h3>Teacher</h3>
      <div class="field"><span>Voice</span>
        <select id="voice" title="Teacher's voice">
          <option value="robot">robot voice</option>
          <option value="browser">browser voice</option>
          <option value="off">no voice</option>
        </select></div>
      <label class="check" title="Pause after each sentence and its drawing until you press Space">
        <input type="checkbox" id="step"> Step mode: pause after each sentence</label>
    </section>
  </div>

  <div id="dock" hidden>
    <span id="play" hidden></span>
    <span id="transport" hidden>
      <button id="back" title="Back a step (←; again within 3 s: the step before)">⏮</button>
      <button id="pause" class="big" title="Pause / resume (Space)">❚❚</button>
      <button id="fwd" title="Skip to the next step (→)">⏭</button>
    </span>
    <button id="next" hidden title="Next step (Space, →, or the VR trigger)">Next ▸</button>
    <span id="progress" hidden title="Step"><i id="progress-fill"></i></span>
    <span id="progress-label" hidden></span>
    <select id="speed" class="chip" title="Playback speed (animations and voice)">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="1.75">1.75×</option>
      <option value="2">2×</option>
    </select>
  </div>

  <aside id="panel">
    <div class="row">
      <select id="lessons"><option value="">Lessons…</option></select>
      <select id="mode" title="vcl: commands only · mixed: prose + ```vcl fences">
        <option value="vcl">vcl</option>
        <option value="mixed">mixed</option>
      </select>
      <button id="open" title="Open a lesson file from this computer (.vcl, .md or .txt); you can also drop one on the editor">Open…</button>
      <input type="file" id="open-file" accept=".vcl,.md,.markdown,.txt,text/plain,text/markdown" hidden>
    </div>
    <div class="row checks">
      <label class="check" title="Selecting another lesson stops the current one and wipes the board">
        <input type="checkbox" id="autoclear"> clear board on switch</label>
      <label class="check" title="Wrap long lines in the editor">
        <input type="checkbox" id="wrap"> wrap lines</label>
    </div>
    <div id="editor-wrap">
      <div id="cur-line" hidden></div>
      <div id="editor-mirror" aria-hidden="true"></div>
      <textarea id="editor" wrap="off" spellcheck="false" placeholder="ax: axes 0,0 x=-4..4 y=-3..3&#10;plot ax &quot;sin(x)&quot;&#10;say &quot;Here is a sine wave.&quot;"></textarea>
    </div>
    <div class="row">
      <button id="run" class="primary" title="Ctrl+Enter">Run</button>
      <button id="skip" title="Finish all pending animation">Skip</button>
      <button id="clear" title="Stop and wipe the board now">Clear</button>
    </div>
  </aside>

  <ul id="log"></ul>

  <script type="module" src="js/main.js"></script>
</body>
</html>
